name: Clean deploy
on:
  workflow_call:
    secrets:
      SSH_HOSTNAME:
        required: true
      API_HOSTNAME:
        required: true
      DIRECT_HOSTNAME:
        required: true
      RESOURCE_HOSTNAME:
        required: true
      ADMIN_HOSTNAME:
        required: true
      USERNAME:
        required: true
      PRIVATE_KEY:
        required: true
      PROXY_SECRET:
        required: true
      BTP_SECRET:
        required: true
      CF_ACCOUNT_ID:
        required: true
      CF_API_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOSTNAME }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            mkdir /data
            rm -rf /data/deploy
            mkdir /data/deploy
      - uses: actions/checkout@v4
      - run: |
          echo CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }} >> .env
          echo CF_API_TOKEN=${{ secrets.CF_API_TOKEN }} >> .env
          echo API_HOSTNAME=${{ secrets.API_HOSTNAME }} >> .env
          echo DIRECT_HOSTNAME=${{ secrets.DIRECT_HOSTNAME }} >> .env
          echo RESOURCE_HOSTNAME=${{ secrets.RESOURCE_HOSTNAME }} >> .env
          echo ADMIN_HOSTNAME=${{ secrets.ADMIN_HOSTNAME }} >> .env
          sed -i "s/{PROXY_SECRET}/${{ secrets.PROXY_SECRET }}/g" bad_proxy/config.json
          sed -i "s/{BTP_SECRET}/${{ secrets.BTP_SECRET }}/g" bad_proxy/config.json
          # BPC parses vless ids as 16 raw bytes; a non-uuid secret makes the
          # container exit at startup, so fail here while nothing is deployed.
          # VLESS and Trojan share PROXY_SECRET, so this checks that one value.
          id=$(sed -n 's/.*"users": \["\([^"]*\)"\].*/\1/p' bad_proxy/config.json | head -1 | tr -d '-')
          [ ${#id} -eq 32 ] || { echo "PROXY_SECRET is not a 16-byte uuid"; exit 1; }
          python3 -m json.tool bad_proxy/config.json > /dev/null
      - uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOSTNAME }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          source: "."
          target: "/data/deploy"
          overwrite: true
