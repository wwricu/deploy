name: Clean deploy
on:
  workflow_call:
    secrets:
      HOSTNAME:
        required: true
      ADMIN_HOSTNAME:
        required: true
      USERNAME:
        required: true
      PRIVATE_KEY:
        required: true
      V2RAY_UUID:
        required: true
      CF_ACCOUNT_ID:
        required: true
      CF_KV_NAMESPACE_ID:
        required: true
      CF_KV_API_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ADMIN_HOSTNAME }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            mkdir /data
            rm -rf /data/deploy
            mkdir /data/deploy
      - uses: actions/checkout@v4
      - run: |
          echo CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }} >> .env
          echo CF_KV_NAMESPACE_ID=${{ secrets.CF_KV_NAMESPACE_ID }} >> .env
          echo CF_KV_API_TOKEN=${{ secrets.CF_KV_API_TOKEN }} >> .env
          echo HOSTNAME=${{ secrets.HOSTNAME }} >> .env
          echo ADMIN_HOSTNAME=${{ secrets.ADMIN_HOSTNAME }} >> .env
          echo RESOURCE_HOSTNAME=${{ secrets.RESOURCE_HOSTNAME }} >> .env
          sed -i "s/{V2RAY_UUID}/${{ secrets.V2RAY_UUID }}/g" v2ray/config.json
          sed -i "s/{TROJAN_UUID}/${{ secrets.V2RAY_UUID }}/g" bad_proxy/config.json
          sed -i "s/{BTP_UUID}/${{ secrets.V2RAY_UUID }}/g" bad_proxy/config.json
      - uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ADMIN_HOSTNAME }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          source: "."
          target: "/data/deploy"
          overwrite: true
