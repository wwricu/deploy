services:
  bad_proxy:
    container_name: bad_proxy
    image: wwricu/bad-proxy-core:snapshot
    restart: always
    expose:
      - 8443
      - 8444
    volumes:
      # same path as the prod file: the image reads /etc/bad-proxy with a hyphen
      - /data/deploy/bad_proxy/config.json:/etc/bad-proxy/config.json:ro
    networks:
      - default_network
