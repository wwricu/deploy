services:
  basic-service:
    container_name: basic-service
    image: wwricu/basic-service:snapshot
    restart: on-failure:3
    expose:
      - 8000
    environment:
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_KV_NAMESPACE_ID=${CF_KV_NAMESPACE_ID}
      - CF_KV_API_TOKEN=${CF_KV_API_TOKEN}
    volumes:
      - /data/basic-service:/data
    networks:
      - default_network
