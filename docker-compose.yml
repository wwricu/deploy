services:
  caddy:
    container_name: caddy
    image: caddy:2-alpine
    restart: always
    volumes:
      # The Caddyfile lives here now; admin-page is a static host and ships no edge config.
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy/data:/data/caddy
      - /data/caddy/log:/var/log
    environment:
      - API_HOSTNAME=${API_HOSTNAME}
      - DIRECT_HOST=${DIRECT_HOST}
      - RESOURCE_HOSTNAME=${RESOURCE_HOSTNAME}
      - ADMIN_HOSTNAME=${ADMIN_HOSTNAME}
    ports:
      - "443:443"
      - "80:80"
    networks:
      - default_network
  basic-service:
    container_name: basic-service
    image: wwricu/basic-service:latest
    restart: on-failure:3
    expose:
      - 8000
    environment:
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_KV_NAMESPACE_ID=${CF_KV_NAMESPACE_ID}
      - CF_KV_API_TOKEN=${CF_KV_API_TOKEN}
    volumes:
      - /data/basic-service:/data
    networks:
      - default_network
  v2ray:
    container_name: v2ray
    image: v2fly/v2fly-core:latest
    restart: always
    expose:
      - 8443
    volumes:
      - /data/deploy/v2ray/config.json:/etc/v2ray/config.json
      - /data/deploy/v2ray/log:/var/log/v2ray
    command: run -config /etc/v2ray/config.json
    networks:
      - default_network
  bad_proxy:
    container_name: bad_proxy
    image: wwricu/bad-proxy-core:latest
    restart: always
    # BPC runs plain HTTP on the compose network; only Caddy terminates TLS.
    # Reachable solely through Caddy's /bp and /btp reverse_proxy routes.
    expose:
      - 8443 # vless + xhttp, path /bp
      - 8444 # btp + xhttp, path /btp
    volumes:
      # path matches the image CMD (/etc/bad-proxy, hyphen, not bad_proxy)
      - /data/deploy/bad_proxy/config.json:/etc/bad-proxy/config.json:ro
    networks:
      - default_network
networks:
  default_network:
