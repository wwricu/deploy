services:
  caddy:
    container_name: caddy
    image: caddy:2-alpine
    restart: always
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy/data:/data/caddy
      - /data/caddy/log:/var/log
    environment:
      - API_HOSTNAME=${API_HOSTNAME}
      - DIRECT_HOSTNAME=${DIRECT_HOSTNAME}
      - RESOURCE_HOSTNAME=${RESOURCE_HOSTNAME}
      - ADMIN_HOSTNAME=${ADMIN_HOSTNAME}
    ports:
      - "443:443"
      - "80:80"
    networks:
      - default_network
  basic-service:
    container_name: basic-service
    image: wwricu/basic-service:latest
    restart: on-failure:5
    expose:
      - 8000
    environment:
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_API_TOKEN=${CF_API_TOKEN}
    volumes:
      - /data/basic-service:/data
    networks:
      - default_network
  bad_proxy:
    container_name: bad_proxy
    image: wwricu/bad-proxy-core:latest
    restart: always
    expose:
      - 8443
      - 8444
      - 8445
    volumes:
      - /data/deploy/bad_proxy/config.json:/etc/bad-proxy/config.json:ro
    networks:
      - default_network
  # Dev-only: local origin for throughput measurements, and v2fly as a reference
  # server. Neither is reachable on any master route.
  probe:
    container_name: probe
    image: alpine:latest
    restart: always
    expose:
      - 80
    volumes:
      - /data/probe:/www:ro
    command: ["httpd", "-f", "-p", "80", "-h", "/www"]
    networks:
      - default_network
  xray_probe:
    container_name: xray_probe
    image: v2fly/v2fly-core:latest
    restart: always
    expose:
      - 8450
      - 8451
    volumes:
      - /data/deploy/xray/config.json:/etc/xray/config.json:ro
    entrypoint: ["xray"]
    command: ["-c", "/etc/xray/config.json"]
    networks:
      - default_network
networks:
  default_network:
