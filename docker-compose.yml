services:
  caddy:
    container_name: caddy
    image: wwricu/admin-page:latest
    restart: always
    volumes:
      - /data/caddy/data:/data/caddy
      - /data/caddy/log:/var/log
    environment:
      - HOSTNAME=${HOSTNAME}
      - ADMIN_HOSTNAME=${ADMIN_HOSTNAME}
      - RESOURCE_HOSTNAME=${RESOURCE_HOSTNAME}
    ports:
      - "443:443"
      - "80:80"
    networks:
      - default_network
  basic-service:
    container_name: basic-service
    image: wwricu/basic-service:latest
    restart: on-failure:3
    expose:
      - 8000
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - /data/basic-service:/data
    networks:
      - default_network
  blog-page:
    container_name: blog-page
    image: wwricu/blog-page:latest
    restart: always
    expose:
      - 3000
    environment:
      - NEXT_BASE_URL=http://basic-service:8000
      - NEXT_SITE_URL=https://${HOSTNAME}
      - NEXT_API_KEY_ID=${PAGE_API_KEY_ID}
      - NEXT_API_KEY=${PAGE_API_KEY}
    networks:
      - default_network
  v2ray:
    container_name: v2ray
    image: v2fly/v2fly-core:latest
    restart: always
    expose:
      - 8443
    volumes:
      - /data/deploy/v2ray/config.json:/etc/v2ray/config.json
      - /data/deploy/v2ray/log:/var/log/v2ray
    command: run -config /etc/v2ray/config.json
    networks:
      - default_network
  bad_proxy:
    container_name: bad_proxy
    image: wwricu/bad-proxy-core:latest
    restart: always
    # btp + vless/xhttp run on BPC's own TLS, direct on the host: Caddy cannot
    # carry BPC's single endless duplex POST, so these do not go behind it.
    ports:
      - "8447:8447" # vless + xhttp, path /bx
      - "8448:8448" # btp, raw TLS
    volumes:
      # path matches the image CMD (/etc/bad-proxy, hyphen, not bad_proxy)
      - /data/deploy/bad_proxy/config.json:/etc/bad-proxy/config.json:ro
      # reuse Caddy's issued LE cert for admin.wwr.icu (read-only; container runs as root)
      - /data/caddy/data/certificates/acme-v02.api.letsencrypt.org-directory/admin.wwr.icu:/etc/bad-proxy/certs:ro
    networks:
      - default_network
networks:
  default_network:
